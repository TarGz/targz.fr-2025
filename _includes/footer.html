{% capture currentYear %}{{ 'now' | date: '%Y' }}{% endcapture %}

<footer class="site-footer">
  <div class="container">
    <div class="footer-content">

      <!-- Keep in Touch Section (centered) -->
      <div class="footer-section footer-center">
        <h3>Let's Keep in Touch</h3>
        <div class="social-links">
          <a href="https://instagram.com/targz" class="social-link" title="Instagram">
            <img src="{{ '/assets/icons/instagram.svg' | relative_url }}" alt="Instagram" width="28" height="28">
          </a>
          <a href="https://www.reddit.com/user/_targz_/submitted/" class="social-link" title="Reddit">
            <img src="{{ '/assets/icons/reddit.svg' | relative_url }}" alt="Reddit" width="28" height="28">
          </a>
          <a href="https://tiktok.com/@targz" class="social-link" title="TikTok">
            <img src="{{ '/assets/icons/tiktok.svg' | relative_url }}" alt="TikTok" width="28" height="28">
          </a>
        </div>
      </div>

      <!-- Targz Picture Section -->
      <div class="footer-section footer-image">
        <div class="footer-avatar">
          <img src="{{ '/assets/images/footer-targz.webp' | relative_url }}" alt="Targz" class="footer-avatar-img">
        </div>
      </div>

    </div>

    <!-- Copyright -->
    <div class="footer-bottom">
      <p>© {{ currentYear }} {{ site.title }}. All rights reserved.</p>
    </div>
  </div>
</footer>
