{%- assign current_page_url = page.url | relative_url -%}

<div id="slide-nav-overlay" class="slide-nav-overlay">
  <button id="nav-close" class="nav-close" aria-label="Close menu">
    <div class="close-line"></div>
    <div class="close-line"></div>
  </button>
  <div class="slide-nav-container">
    <div class="slide-nav-list">
      <a href="{{ '/' | relative_url }}">Pen Plotting</a>
      <a href="{{ '/exhibitions/' | relative_url }}">Exhibitions</a>
      <a href="{{ '/commissions/' | relative_url }}">Commissions</a>
      <a href="{{ '/bits/' | relative_url }}">Bits</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="https://www.reddit.com/user/_targz_/submitted/">News</a>
      <a href="https://shop.targz.fr">Shop</a>
    </div>
  </div>
</div>

<nav>
  <div class="nav-bar">
    <a href="{{ '/' | relative_url }}" class="nav-logo">
      <img src="{{ '/assets/images/targz.webp' | relative_url }}" alt="Targz" />
    </a>

    <div class="nav-right">
      <a href="https://shop.targz.fr" class="nav-shop-btn" title="Shop original pen plots">Shop</a>
      <button id="burger-menu" class="nav-burger" aria-label="Menu">
        <div class="burger-line"></div>
        <div class="burger-line"></div>
        <div class="burger-line"></div>
      </button>
    </div>
  </div>
</nav>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const burgerMenu = document.getElementById('burger-menu');
  const navClose = document.getElementById('nav-close');
  const slideNavOverlay = document.getElementById('slide-nav-overlay');
  const body = document.body;

  function openMenu() {
    slideNavOverlay.classList.add('active');
    body.classList.add('nav-active');
  }

  function closeMenu() {
    slideNavOverlay.classList.remove('active');
    body.classList.remove('nav-active');
  }

  if (burgerMenu && slideNavOverlay) {
    burgerMenu.addEventListener('click', function(e) {
      e.preventDefault();
      openMenu();
    });

    navClose.addEventListener('click', function(e) {
      e.preventDefault();
      closeMenu();
    });

    // Close menu when clicking on a link
    const navLinks = slideNavOverlay.querySelectorAll('a');
    navLinks.forEach(link => {
      link.addEventListener('click', function() {
        closeMenu();
      });
    });

    // Click anywhere on overlay (not on a link) closes the menu
    slideNavOverlay.addEventListener('click', function(event) {
      if (!event.target.closest('a')) {
        closeMenu();
      }
    });
  }
});
</script>
